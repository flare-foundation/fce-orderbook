# Docker Compose override for Coston2 deployment.
# Usage: docker compose -f docker-compose.yaml -f docker-compose.coston2.yaml up
services:
  ext-proxy:
    volumes:
      - ./config/proxy/extension_proxy.coston2.docker.toml:/app/config/config.toml:ro

  extension-tee:
    environment:
      - CHAIN_URL=${CHAIN_URL:-https://coston2-api.flare.network/ext/C/rpc}
      # Coston2 chain id — without this the base compose default (31337) wins and
      # register-tee reverts with InvalidTeePublicKeyOrSignature (signature is chain-id-bound).
      - CHAIN_ID=${CHAIN_ID:-114}

networks:
  default:
    # ponytail: project-specific name. The scaffold's `extension-scaffold-coston2`
    # is copy-pasted into 5 sibling examples; sharing one network name across
    # compose projects means whoever creates it owns the labels and the others
    # race/collide on it ("incorrect label com.docker.compose.network").
    name: ${COMPOSE_NETWORK:-orderbook-coston2}
    external: false
